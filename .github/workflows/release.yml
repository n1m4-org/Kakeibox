# テスト → 本番用の鍵で署名した APK をビルド → GitHub Releases に公開する。
# アプリは Releases の最新版（kakeibox-<versionCode>.apk）を見てアプリ内で更新する。
# 署名鍵は Settings → Secrets and variables → Actions に登録する：
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 鍵が未登録のときはビルドとテストだけ行い、Release は作らない。
name: Release

on:
  push:
    branches: [claude/household-budget-app-9bz3xg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: バージョン番号（実行番号 + 100）
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: 署名鍵を用意
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::署名鍵が未登録のため、Release は作成しません"
          fi

      - name: テストとビルド
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Release を作成
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="kakeibox-${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          git log -1 --pretty=%B > notes.txt
          gh release create "v1.0.${VERSION_CODE}" "$APK" \
            --title "Kakeibox 1.0.${VERSION_CODE}" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA"

      - name: 鍵を削除
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
